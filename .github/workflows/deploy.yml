name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aucun droit par défaut : chaque job demande explicitement ce dont il a besoin.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages lit la configuration Pages du dépôt (GET /repos/.../pages).
      # En lecture seule : l'activation du site relèverait de pages: write.
      pages: read
    steps:
      - name: Checkout
        # Actions épinglées par empreinte de commit : un tag peut être redéplacé
        # vers du code malveillant, pas un SHA.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Évite de laisser le jeton GITHUB_TOKEN dans .git/config du runner.
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # --ignore-scripts neutralise les scripts d'installation arbitraires
        # d'une dépendance compromise.
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        # Signale les failles connues sans bloquer la publication du site.
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
